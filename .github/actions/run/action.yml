name: 'TWD CLI Run'
description: 'Run TWD browser tests with Puppeteer, optionally as one shard of a parallel matrix, including contract validation reporting'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  working-directory:
    description: 'Directory where twd.config.json lives'
    required: false
    default: '.'
  contract-report:
    description: 'Post contract validation report as a PR comment (requires pull-requests: write permission)'
    required: false
    default: 'false'
  shard:
    description: >-
      Run one shard of the suite, as <index>/<total> (e.g. 2/4). Each shard
      discovers the whole suite and takes every nth test, so the test count
      never has to be known in advance. Leave empty to run everything in one
      job. Join the shards afterwards with `npx twd-cli merge`.
    required: false
    default: ''
  report-dir:
    description: >-
      Where the run report folder is written. Leave empty to use report.dir
      from twd.config.json, or .twd/report if that is not set either.
    required: false
    default: ''
  upload-report:
    description: >-
      Upload the report folder as an artifact named twd-report
      (twd-report-<index> for a shard, the layout twd-cli merge expects).
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Cache Puppeteer browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-puppeteer-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-puppeteer-

    - name: Install Chrome for Puppeteer
      shell: bash
      run: npx puppeteer browsers install chrome

    - name: Resolve shard
      id: shard
      shell: bash
      env:
        SHARD: ${{ inputs.shard }}
      run: |
        if [ -z "$SHARD" ]; then
          echo "index=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Artifact names cannot contain "/", so the index alone identifies the
        # shard. twd-cli itself validates the spec and fails loudly on a bad
        # one, so this only has to be good enough to name the artifact.
        if ! printf '%s' "$SHARD" | grep -qE '^[0-9]+/[0-9]+$'; then
          echo "::error::Invalid shard \"$SHARD\". Expected <index>/<total>, e.g. 2/4."
          exit 1
        fi
        echo "index=${SHARD%%/*}" >> "$GITHUB_OUTPUT"

    - name: Resolve the report directory
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        REPORT_DIR_INPUT: ${{ inputs.report-dir }}
      run: |
        # The input wins when set; otherwise twd.config.json is the source of
        # truth, same as the CLI's own fallback, so this only needs to know
        # where to look afterwards.
        DIR=$(node -e "
          const fs = require('fs');
          let dir = process.env.REPORT_DIR_INPUT;
          if (!dir) {
            try {
              const config = JSON.parse(fs.readFileSync('twd.config.json', 'utf-8'));
              if (config.report && config.report.dir) dir = config.report.dir;
            } catch {}
          }
          console.log(dir || './.twd/report');
        ")
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        echo "Report will be written to $DIR"

        # upload-artifact resolves its path from the workspace root, not from
        # working-directory, so it needs the two joined, and it rejects a '.'
        # segment like 'app/./x'. Normalising here keeps the join in one place
        # instead of repeating it in the upload step.
        UPLOAD_PATH=$(node -e "
          const path = require('path');
          console.log(path.normalize(path.join(process.argv[1], process.argv[2])));
        " "$WORKING_DIRECTORY" "$DIR")
        echo "upload-path=$UPLOAD_PATH" >> "$GITHUB_OUTPUT"

    - name: Run TWD tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SHARD: ${{ inputs.shard }}
        REPORT_DIR_INPUT: ${{ inputs.report-dir }}
      run: |
        # Built as an array, and --report-dir is only passed when the caller
        # set it, so an empty input leaves report.dir from twd.config.json (or
        # the CLI's own default) in charge instead of overriding it.
        args=(run)
        [ -n "$SHARD" ] && args+=(--shard "$SHARD")
        [ -n "$REPORT_DIR_INPUT" ] && args+=(--report-dir "$REPORT_DIR_INPUT")
        npx twd-cli "${args[@]}"

    - name: Write job summary
      # The merge job writes the summary for a sharded run.
      if: always() && inputs.shard == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        npx twd-cli report "$REPORT_DIR" --format markdown >> "$GITHUB_STEP_SUMMARY" \
          || echo "::warning::No TWD report to summarise in $REPORT_DIR"

    - name: Upload report
      # always(): a red run must still surface its report.
      if: always() && inputs.upload-report == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.shard.outputs.index != '' && format('twd-report-{0}', steps.shard.outputs.index) || 'twd-report' }}
        path: ${{ steps.resolve.outputs.upload-path }}
        if-no-files-found: ${{ inputs.shard != '' && 'error' || 'warn' }}

    - name: Post contract report to PR
      if: inputs.contract-report == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SHARD: ${{ inputs.shard }}
        REPORT_DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        # A sharded run deliberately writes no contract markdown: every shard
        # would overwrite the others with a fraction of the mocks. `twd-cli
        # merge` writes it, so the comment belongs in the merge job.
        if [ -n "$SHARD" ]; then
          echo "::notice::Skipping the contract PR comment: this is shard $SHARD. Post it from the job that runs \`twd-cli merge\`, which is what writes the report."
          exit 0
        fi

        REPORT_PATH="$REPORT_DIR/summary.md"
        if [ ! -f "$REPORT_PATH" ]; then
          echo "No report summary found — skipping PR comment"
          exit 0
        fi
        BODY=$(mktemp)
        cp "$REPORT_PATH" "$BODY"
        echo "" >> "$BODY"
        echo "[View full report →](${RUN_URL})" >> "$BODY"

        if ! gh pr comment "${PR_NUMBER}" --body-file "$BODY" 2>/dev/null; then
          echo "::warning::Could not post contract report to PR. Ensure the workflow has 'pull-requests: write' permission."
        fi
