name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write is what makes this job publishable at all now. npm Trusted
    # Publishing authenticates it with a short-lived GitHub OIDC token instead of
    # a long-lived NPM_TOKEN, and the same token signs provenance. Without this
    # permission there is no credential to present, so the publish fails rather
    # than quietly shipping an unsigned package.
    #
    # The trust is configured on npm against this repository AND this workflow
    # filename, so renaming this file revokes it. Because `release` events run
    # the default branch's copy of a workflow, a change here only takes effect
    # once it is on main.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # node:24 ships npm 11.13.0 and `npm stage publish` needs 11.15.0 or newer.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Stage the publish
        # No NODE_AUTH_TOKEN, and no npm secret in this repository any more: the
        # trusted publisher on npm authenticates this job over OIDC.
        #
        # `stage publish` does NOT make the version live. It uploads the tarball
        # and defers proof-of-presence, so a green run here means "staged" —
        # approve it in npm's UI or with `npm stage approve <stage-id>` to
        # actually publish. That deferral is the point: the credential that can
        # stage a release cannot complete one on its own.
        #
        # Prereleases go to the "beta" dist-tag so `npm install twd-cli` keeps
        # resolving to the stable release.
        run: npm stage publish --access public --provenance ${{ github.event.release.prerelease && '--tag beta' || '' }}
